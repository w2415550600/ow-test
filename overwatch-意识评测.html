    <style>

<body>

    <script>
        // ==================== 题库数据 ====================
        const questions = [
            // 问题 1：重装·对位机制克制
            {
                type: 'tank',
                title: '问题 1：重装·对位机制克制',
                question: '敌方 D.Va 在场上极其活跃，机动性拉满，且【防御矩阵】精准拦截了己方黑百合和卡西迪的所有关键射击。作为我方坦克，你该换出哪个英雄进行"机制上的硬克制"？',
                options: [
                    '换查莉娅（毛妹），其粒子束（激光）可以直接穿透 D.Va 的防御矩阵，强行融化其机甲。',
                    '换路霸，尝试在掩体后使用链钩穿过其矩阵盲区，强行将其拉入己方阵容中击杀。',
                    '换奥丽莎，利用标枪在正面强推和阻断大招，在正面战场建立强盾阵线进行正面消耗。',
                    '换莱因哈特（大锤），在正面利用护盾和烈焰打击，与其进行正面资源与盾牌强行博弈。'
                ],
                correct: 0,
                explanation: '毛妹的粒子束属于能量轨道武器，D.Va 的防御矩阵（DM）完全无法拦截。这是守望先锋中最经典、也是最好使的重装对位硬克制关系之一。'
            },
            // 问题 2：输出·源氏切入时机
            {
                type: 'dps',
                title: '问题 2：输出·源氏切入时机',
                question: '占领要点绿洲城。敌方安娜刚交了生化手雷（砸向其前排），对方卡西迪正在高台拉边线企图寻找战术大招角度，你手握大招该怎么做？',
                options: [
                    '拔刀直接切入高台卡西迪，利用高伤害机动性，强行封锁卡西迪后续战术大招的释放空间。',
                    '观察到对方主力治疗交出保命技能，直接闪进点内配合重装集火敌方残血的坦克。',
                    '观察卡西迪站位，利用坦克吸引火力瞬移切入，斩杀无瓶安娜刷新 S 再斩卡西迪。',
                    '暂时放弃切入，全盘转为贴身防守，随时准备用闪光弹/飞镖打断来切安娜的敌方刺客。'
                ],
                correct: 2,
                explanation: '安娜交瓶是绝对集火信号。卡西迪开大有延迟且视野受限，在有前排吸引时，借空档斩杀没瓶子的辅助是最优选。'
            },
            // 问题 3：辅助·巴蒂斯特保人
            {
                type: 'support',
                title: '问题 3：辅助·巴蒂斯特保人',
                question: '漓江塔激战。敌方源氏拔刀突向己方无位移的禅雅塔。你手里有【锁血灯】和【愈合冲击】，如何保人？',
                options: [
                    '听到他拔刀音效的瞬间，立刻在自己脚下扔出锁血灯保护全队。',
                    '等源氏砍出第一刀、禅雅塔血量过半时扔灯抬血，利用灯的无敌反打。',
                    '不扔灯，直接开启大招【增幅矩阵】试图在伤害制造前秒杀源氏。',
                    '预判禅雅塔无法存活，利用被动起跳拉开到高台安全区域，寻找机会进行远程补刀。'
                ],
                correct: 1,
                explanation: '提前扔灯会让有经验的源氏直接转火砍灯。卡准血线交灯并开启范围群奶，能拉长禅雅塔的生存期并逼退源氏。'
            },
            // 问题 4：重装·阵容协同变阵
            {
                type: 'tank',
                title: '问题 4：重装·阵容协同变阵',
                question: '敌方拿出"黑影+末日铁拳+源氏"的三放狗快攻阵容，己方后排辅助安娜和禅雅塔频频暴毙。此时最合理的坦克换人抉择是？',
                options: [
                    '换破坏球，通过高机动性骚扰敌方后排，打乱其三刺客阵容的进攻节奏。',
                    '换奥丽莎，在正面利用强硬身躯配合强标枪打断铁拳、黑影，强行进行正面战线换血。',
                    '换 D.Va，利用高机动性的【防御矩阵】贴身保护己方后排，并在狗位交完位移后配合集火收割。',
                    '换西格玛，在己方后排放置实验屏障切断敌方突脸刺客的奶线，并在后排进行阵地防御。'
                ],
                correct: 2,
                explanation: '面对高协同的放狗突脸，重装必须承担保护后排的职责。D.Va 的矩阵是克制弹道爆发（如源氏镖、黑影扫射）并为辅助争取拉扯和治疗空间的终极手段。'
            },
            // 问题 5：输出·索杰恩残局选择
            {
                type: 'dps',
                title: '问题 5：输出·索杰恩残局选择',
                question: '努巴尼 A 点残局，双方坦克皆战亡。敌方猎空骚扰己方安娜，敌方法拉吃着蓝线在天空狂轰，你应该？',
                options: [
                    '升空或在地面使用电磁炮右键，全力对空，尝试在天使蓝线牵住法拉时强行点杀法拉。',
                    '利用滑铲跨越战场，切入敌方没有保护的另一个后排辅助，进行对换人头。',
                    '回防保护安娜，右键击退或协同击杀猎空，保障治疗后再利用掩体反空。',
                    '站在开阔地利用滑铲身法拉扯法拉的火箭弹道，在正面进行火力对点。'
                ],
                correct: 2,
                explanation: '后排安娜死掉，队伍便失去了唯一的续航，你也无法活着点死法拉。先清理近身的威胁（猎空），保住团队发动机是根本。'
            },
            // 问题 6：辅助·雾子铃铛时机
            {
                type: 'support',
                title: '问题 6：辅助·雾子铃铛时机',
                question: '暴雪乐园防守。敌方渣客女王开启大招狂轰乱炸命中了你和另外两名队友。此时己方主 T 也被大锤撞倒，【铃铛】给谁？',
                options: [
                    '立即扔在脚下，解除自己和两名输出的禁疗并持续回血。',
                    '穿墙把铃铛丢给被撞倒的主 T，保护他不被集火补伤害。',
                    '暂时保留铃铛，自己交瞬步拉开距离到安全位置，准备进行后续的拉扯和分批治疗。',
                    '直接大招【狐狸奔袭】对撞，用高额移速拉扯逃离女王禁疗伤害。'
                ],
                correct: 0,
                explanation: '女王大招的致命处在于高额 DOT 流血和全队禁疗。净化自己和队友的禁疗状态，保住三人战力，是阻止敌方滚雪球的关键。'
            },
            // 问题 7：输出·狙击手反制
            {
                type: 'dps',
                title: '问题 7：输出·狙击手反制',
                question: '敌方黑百合在直布罗陀 A 点高台构筑了极其恐怖的"死亡禁区"，己方露头就被秒。作为 DPS，能够最有效进行单兵克制并逼迫黑百合换人的选择是？',
                options: [
                    '换黑影（Sombra），利用隐身摸上高台，通过偷袭和黑入强行破坏其瞄准节奏，定点抹杀。',
                    '换卡西迪，躲在己方坦克盾后面，尝试在地面和高台百合拼枪。',
                    '换狂鼠，在掩体后向高台进行抛射弹药压制，利用弹跳炸弹的抛物线和震荡地雷逼退黑百合。',
                    '换托比昂，在后方掩体旁部署自动炮台，利用炮台自动索敌限制黑百合的露头和架枪时间。'
                ],
                correct: 0,
                explanation: '黑影和源氏是狙击手的天然克星。隐身摸近百合，在其开镜盲区发起突袭，能让高台狙击手彻底丧失输出环境，甚至逼迫其更换前排或近战防守英雄。'
            },
            // 问题 8：输出·黑影战术目标
            {
                type: 'dps',
                title: '问题 8：输出·黑影战术目标',
                question: '进攻直布罗陀防守点。敌方防守核心是高台黑百合，且配有天使牵线。你的战术突破口是？',
                options: [
                    '观察敌方站位，直接大招侵入地面人群配合前排打出爆发控制。',
                    '隐身摸上高台，通过 Hack 打断并集火百合，逼退或击退狙击位，释放地面空间。',

                correct: 1,
                explanation: '黑影是高台长手脆皮的梦魇。干扰并击杀高台长枪位（黑百合），释放己方地面和辅助的推进生存空间是刺客职责。'

            // 问题 9：辅助·安娜极限求生

            gainNode.connect(audioContext.destination);
            
            const now = audioContext.currentTime;
            
            switch(type) {
                case 'click':
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(800, now);
                    oscillator.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    oscillator.start(now);
                    oscillator.stop(now + 0.1);
                    break;
                    
                case 'correct':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(523.25, now); // C5
                    oscillator.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    oscillator.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    gainNode.gain.setValueAtTime(0.15, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    oscillator.start(now);
                    oscillator.stop(now + 0.4);
                    break;
                    
                case 'wrong':
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(200, now);
                    oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    oscillator.start(now);
                    oscillator.stop(now + 0.3);
                    break;
                    
                case 'finish':
                    // 大三和弦琶音
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, i) => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + i * 0.15);
                        gain.gain.setValueAtTime(0.12, now + i * 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.3);
                        osc.start(now + i * 0.15);
                        osc.stop(now + i * 0.15 + 0.3);
                    });
                    break;
            }
        }

        // ==================== 星空粒子背景 ====================
        function initStarfield() {
            const canvas = document.getElementById('starfield');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);
            
            const stars = [];
            const numStars = 100;
            
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speedX: (Math.random() - 0.5) * 0.3,
                    speedY: (Math.random() - 0.5) * 0.3,
                    opacity: Math.random() * 0.5 + 0.3,
                    isOrange: Math.random() < 0.1 // 10% 的星星是橙色
                });
            }
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                stars.forEach(star => {
                    star.x += star.speedX;
                    star.y += star.speedY;
                    
                    if (star.x < 0) star.x = canvas.width;
                    if (star.x > canvas.width) star.x = 0;
                    if (star.y < 0) star.y = canvas.height;
                    if (star.y > canvas.height) star.y = 0;
                    
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fillStyle = star.isOrange 
                        ? `rgba(249, 158, 26, ${star.opacity})` 
                        : `rgba(255, 255, 255, ${star.opacity})`;
                    ctx.fill();
                });
                
                requestAnimationFrame(animate);
            }
            
            animate();
        }

        // ==================== OW Logo 绘制 ====================
        function drawLogo() {
            const canvas = document.getElementById('logoCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 80;
            
            // 绘制外圈
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#f99e1a';
            ctx.lineWidth = 8;
            ctx.stroke();
            
            // 绘制内圈
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius - 15, 0, Math.PI * 2);
            ctx.strokeStyle = '#f99e1a';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // 绘制分割线
            for (let i = 0; i < 6; i++) {
                const angle = (i * Math.PI) / 3;
                ctx.beginPath();
                ctx.moveTo(centerX + (radius - 15) * Math.cos(angle), centerY + (radius - 15) * Math.sin(angle));
                ctx.lineTo(centerX + radius * Math.cos(angle), centerY + radius * Math.sin(angle));
                ctx.strokeStyle = '#f99e1a';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
            
            // 绘制中心圆
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
            ctx.fillStyle = '#f99e1a';
            ctx.fill();
        }

        // ==================== 雷达图绘制 ====================
        function drawRadarChart(tankPercent, dpsPercent, supportPercent) {
            const canvas = document.getElementById('radarCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 100;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景三角形
            const angles = [-Math.PI / 2, Math.PI / 6, 5 * Math.PI / 6]; // 上、右下、左下
            const labels = ['T', 'C', 'S'];
            
            // 绘制同心三角形
            for (let level = 1; level <= 4; level++) {
                const levelRadius = (radius / 4) * level;
                ctx.beginPath();
                angles.forEach((angle, i) => {
                    const x = centerX + levelRadius * Math.cos(angle);
                    const y = centerY + levelRadius * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.closePath();
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            // 绘制轴线
            angles.forEach((angle, i) => {
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + radius * Math.cos(angle), centerY + radius * Math.sin(angle));
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                // 绘制标签
                const labelX = centerX + (radius + 20) * Math.cos(angle);
                const labelY = centerY + (radius + 20) * Math.sin(angle);
                ctx.font = 'bold 16px Arial';
                ctx.fillStyle = '#1e293b';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(labels[i], labelX, labelY);
            });
            
            // 绘制数据三角形
            const values = [tankPercent, dpsPercent, supportPercent];
            ctx.beginPath();
            angles.forEach((angle, i) => {
                const valueRadius = (radius * values[i]) / 100;
                const x = centerX + valueRadius * Math.cos(angle);
                const y = centerY + valueRadius * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.closePath();
            
            // 填充渐变
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, 'rgba(249, 158, 26, 0.6)');
            gradient.addColorStop(1, 'rgba(255, 133, 26, 0.6)');
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // 绘制边框和发光效果
            ctx.strokeStyle = '#f99e1a';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // 绘制数据点
            angles.forEach((angle, i) => {
                const valueRadius = (radius * values[i]) / 100;
                const x = centerX + valueRadius * Math.cos(angle);
                const y = centerY + valueRadius * Math.sin(angle);
                
                // 发光效果
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(249, 158, 26, 0.3)';
                ctx.fill();
                
                // 数据点
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#f99e1a';
                ctx.fill();
            });
        }

        // ==================== 题目打乱 ====================
        function shuffleQuestions() {
            shuffledQuestions = [...questions];
            // 不打乱题目顺序，只打乱每题的选项
            shuffledQuestions.forEach(q => {
                const originalOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
                for (let i = originalOptions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [originalOptions[i], originalOptions[j]] = [originalOptions[j], originalOptions[i]];
                }
                q.shuffledOptions = originalOptions;
                q.newCorrectIndex = originalOptions.findIndex(opt => opt.isCorrect);
            });
        }

        // ==================== 页面切换 ====================
        function showPage(pageId) {
            document.getElementById('startPage').classList.add('hidden');
            document.getElementById('questionPage').classList.add('hidden');
            document.getElementById('resultsPage').classList.add('hidden');
            document.getElementById(pageId).classList.remove('hidden');
            document.getElementById(pageId).classList.add('fade-in');
        }

        // ==================== 显示题目 ====================
        function showQuestion() {
            const question = shuffledQuestions[currentQuestionIndex];
            
            // 更新进度
            document.getElementById('progressText').textContent = `${currentQuestionIndex + 1} / ${shuffledQuestions.length}`;
            document.getElementById('progressBar').style.width = `${((currentQuestionIndex + 1) / shuffledQuestions.length) * 100}%`;
            
            // 更新位置徽章
            const badge = document.getElementById('positionBadge');
            badge.className = 'px-3 py-1 rounded-full text-white text-xs font-bold';
            if (question.type === 'tank') {
                badge.classList.add('badge-tank');
                badge.textContent = '重装位';
            } else if (question.type === 'dps') {
                badge.classList.add('badge-dps');
                badge.textContent = '输出位';
            } else {
                badge.classList.add('badge-support');
                badge.textContent = '辅助位';
            }
            
            // 显示题目标题和题目
            document.getElementById('questionTitle').textContent = question.title || '';
            document.getElementById('questionText').textContent = question.question;
            
            // 生成选项
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.shuffledOptions.forEach((option, index) => {
                const optionCard = document.createElement('div');
                optionCard.className = 'option-card bg-white rounded-xl p-4 border-2 border-gray-200 shadow-md';
                optionCard.innerHTML = `
                    <div class="flex items-start">
                        <div class="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center mr-3 flex-shrink-0 mt-0.5">
                            <span class="text-xs text-gray-500">${String.fromCharCode(65 + index)}</span>
                        </div>
                        <p class="text-sm text-gray-700 leading-relaxed">${option.text}</p>
                    </div>
                `;
                optionCard.addEventListener('click', () => selectOption(index));
                optionsContainer.appendChild(optionCard);
            });
            
            // 隐藏解析面板
            document.getElementById('explanationPanel').classList.add('hidden');
        }

        // ==================== 选择选项 ====================
        function selectOption(index) {
            const question = shuffledQuestions[currentQuestionIndex];
            const options = document.querySelectorAll('.option-card');
            
            // 禁用所有选项
            options.forEach(opt => opt.style.pointerEvents = 'none');
            
            // 显示正确和错误答案
            if (index === question.newCorrectIndex) {
                options[index].classList.add('correct');
                score++;
                playSound('correct');
                
                // 更新各位置得分
                if (question.type === 'tank') tankCorrect++;
                else if (question.type === 'dps') dpsCorrect++;
                else supportCorrect++;
            } else {
                options[index].classList.add('wrong');
                options[question.newCorrectIndex].classList.add('correct');
                playSound('wrong');
            }
            
            // 更新各位置总数
            if (question.type === 'tank') tankTotal++;
            else if (question.type === 'dps') dpsTotal++;
            else supportTotal++;
            
            // 显示解析
            document.getElementById('explanationText').textContent = question.explanation;
            document.getElementById('explanationPanel').classList.remove('hidden');
            
            // 更新按钮文本
            const nextBtn = document.getElementById('nextBtn');
            if (currentQuestionIndex === shuffledQuestions.length - 1) {
                nextBtn.textContent = '查看结果';
            } else {
                nextBtn.textContent = '下一题';
            }
        }

        // ==================== 显示结果 ====================
        function showResults() {
            playSound('finish');
            
            // 计算百分制分数（每题5分，满分100分）
            const percentageScore = Math.round((score / shuffledQuestions.length) * 100);
            
            // 更新分数显示为百分制
            document.getElementById('scoreText').textContent = `${percentageScore} 分`;
            
            // 计算各位置得分率
            const tankPercent = tankTotal > 0 ? Math.round((tankCorrect / tankTotal) * 100) : 0;
            const dpsPercent = dpsTotal > 0 ? Math.round((dpsCorrect / dpsTotal) * 100) : 0;
            const supportPercent = supportTotal > 0 ? Math.round((supportCorrect / supportTotal) * 100) : 0;
            
            // 更新雷达图
            document.getElementById('tankScore').textContent = `${tankPercent}%`;
            document.getElementById('dpsScore').textContent = `${dpsPercent}%`;
            document.getElementById('supportScore').textContent = `${supportPercent}%`;
            drawRadarChart(tankPercent, dpsPercent, supportPercent);
            
            // 显示对应段位
            const rank = rankResults.find(r => percentageScore >= r.minScore && percentageScore <= r.maxScore);
            if (rank) {
                document.getElementById('rankTitle').textContent = rank.title;
                document.getElementById('rankSubtitle').textContent = rank.subtitle;
                document.getElementById('rankDescription').textContent = rank.description;
            }
            
            // 生成动态副文案（基于各位置得分率）
            const dynamicSubtitle = generateDynamicSubtitle(tankPercent, dpsPercent, supportPercent);
            document.getElementById('rankDescription').textContent = dynamicSubtitle;
            
            showPage('resultsPage');
        }

        // ==================== 生成海报 ====================
        function generatePoster() {
            playSound('click');
            
            // 创建离屏 Canvas
            const posterCanvas = document.createElement('canvas');
            posterCanvas.width = 750;
            posterCanvas.height = 1334;
            const ctx = posterCanvas.getContext('2d');
            
            // 绘制背景渐变
            const bgGradient = ctx.createLinearGradient(0, 0, 0, 1334);
            bgGradient.addColorStop(0, '#1e293b');
            bgGradient.addColorStop(1, '#0f172a');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, 750, 1334);
            
            // 绘制装饰圆圈
            ctx.beginPath();
            ctx.arc(375, 300, 200, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(249, 158, 26, 0.1)';
            ctx.fill();
            
            // 绘制标题
            ctx.font = 'bold 48px Arial';
            ctx.fillStyle = '#f99e1a';
            ctx.textAlign = 'center';
            ctx.fillText('守望先锋国服意识评测', 375, 150);
            
            // 计算百分制分数
            const percentageScore = Math.round((score / shuffledQuestions.length) * 100);
            
            // 绘制分数（百分制）
            ctx.font = 'bold 120px Arial';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`${percentageScore} 分`, 375, 320);
            
            // 计算各位置得分率
            const tankPercent = tankTotal > 0 ? Math.round((tankCorrect / tankTotal) * 100) : 0;
            const dpsPercent = dpsTotal > 0 ? Math.round((dpsCorrect / dpsTotal) * 100) : 0;
            const supportPercent = supportTotal > 0 ? Math.round((supportCorrect / supportTotal) * 100) : 0;
            
            // 获取段位信息
            const rank = rankResults.find(r => percentageScore >= r.minScore && percentageScore <= r.maxScore);
            if (rank) {
                // 绘制段位标题
                ctx.font = 'bold 56px Arial';
                ctx.fillStyle = '#f99e1a';
                ctx.fillText(rank.title, 375, 450);
                
                // 绘制段位副标题
                ctx.font = '32px Arial';
                ctx.fillStyle = '#94a3b8';
                ctx.fillText(rank.subtitle, 375, 510);
                
                // 生成动态副文案
                const dynamicSubtitle = generateDynamicSubtitle(tankPercent, dpsPercent, supportPercent);
                
                // 绘制描述（自动换行）
                ctx.font = '28px Arial';
                ctx.fillStyle = '#cbd5e1';
                const maxWidth = 650;
                const lineHeight = 40;
                const words = dynamicSubtitle.split('');
                let line = '';
                let y = 600;
                
                for (let i = 0; i < words.length; i++) {
                    const testLine = line + words[i];
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && i > 0) {
                        ctx.fillText(line, 375, y);
                        line = words[i];
                        y += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, 375, y);
            }
            
            // 绘制雷达图
            const radarCenterX = 375;
            const radarCenterY = 900;
            const radarRadius = 150;
            
            // 绘制背景三角形
            const angles = [-Math.PI / 2, Math.PI / 6, 5 * Math.PI / 6];
            const labels = ['T 空间掌控', 'C 集火收割', 'S 协同保活'];
            const values = [
                tankTotal > 0 ? (tankCorrect / tankTotal) * 100 : 0,
                dpsTotal > 0 ? (dpsCorrect / dpsTotal) * 100 : 0,
                supportTotal > 0 ? (supportCorrect / supportTotal) * 100 : 0
            ];
            
            // 绘制同心三角形
            for (let level = 1; level <= 4; level++) {
                const levelRadius = (radarRadius / 4) * level;
                ctx.beginPath();
                angles.forEach((angle, i) => {
                    const x = radarCenterX + levelRadius * Math.cos(angle);
                    const y = radarCenterY + levelRadius * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.closePath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            // 绘制轴线
            angles.forEach((angle, i) => {
                ctx.beginPath();
                ctx.moveTo(radarCenterX, radarCenterY);
                ctx.lineTo(radarCenterX + radarRadius * Math.cos(angle), radarCenterY + radarRadius * Math.sin(angle));
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // 绘制标签
                const labelX = radarCenterX + (radarRadius + 40) * Math.cos(angle);
                const labelY = radarCenterY + (radarRadius + 40) * Math.sin(angle);
                ctx.font = 'bold 24px Arial';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(labels[i], labelX, labelY);
            });
            
            // 绘制数据三角形
            ctx.beginPath();
            angles.forEach((angle, i) => {
                const valueRadius = (radarRadius * values[i]) / 100;
                const x = radarCenterX + valueRadius * Math.cos(angle);
                const y = radarCenterY + valueRadius * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.closePath();
            
            // 填充渐变
            const radarGradient = ctx.createLinearGradient(radarCenterX - radarRadius, radarCenterY - radarRadius, radarCenterX + radarRadius, radarCenterY + radarRadius);
            radarGradient.addColorStop(0, 'rgba(249, 158, 26, 0.8)');
            radarGradient.addColorStop(1, 'rgba(255, 133, 26, 0.8)');
            ctx.fillStyle = radarGradient;
            ctx.fill();
            
            // 绘制边框
            ctx.strokeStyle = '#f99e1a';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // 绘制数据点
            angles.forEach((angle, i) => {
                const valueRadius = (radarRadius * values[i]) / 100;
                const x = radarCenterX + valueRadius * Math.cos(angle);
                const y = radarCenterY + valueRadius * Math.sin(angle);
                
                ctx.beginPath();
                ctx.arc(x, y, 10, 0, Math.PI * 2);
                ctx.fillStyle = '#f99e1a';
                ctx.fill();
            });
            
            // 绘制底部提示
            ctx.font = '24px Arial';
            ctx.fillStyle = '#64748b';
            ctx.fillText('长按保存图片分享给好友', 375, 1280);
            
            // 生成图片
            const dataUrl = posterCanvas.toDataURL('image/png');
            document.getElementById('posterImg').src = dataUrl;
            document.getElementById('posterOverlay').classList.add('active');
        }

        // ==================== 事件监听 ====================
        document.getElementById('startBtn').addEventListener('click', () => {
            initAudio();
            playSound('click');
            shuffleQuestions();
            currentQuestionIndex = 0;
            score = 0;
            tankCorrect = dpsCorrect = supportCorrect = 0;
            tankTotal = dpsTotal = supportTotal = 0;
            showQuestion();
            showPage('questionPage');
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            playSound('click');
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuestions.length) {
                showQuestion();
            } else {
                showResults();
            }
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            playSound('click');
            showPage('startPage');
        });

        document.getElementById('generatePosterBtn').addEventListener('click', generatePoster);

        document.getElementById('closePoster').addEventListener('click', () => {
            document.getElementById('posterOverlay').classList.remove('active');
        });

        // ==================== 初始化 ====================
        window.addEventListener('load', () => {
            initStarfield();
            drawLogo();
        });
    </script>
</body>
